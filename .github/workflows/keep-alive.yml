name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごと
  workflow_dispatch:         # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --silent --max-time 30 --output /dev/null \
            --write-out "HTTP %{http_code}\n" \
            https://mini-test-backend.onrender.com/health
          echo "Ping sent"
